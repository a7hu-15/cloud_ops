name: CloudOps Lab CI Checks

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-and-infrastructure-checks:
    name: Backend Tests & Terraform Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.8.5'

      - name: Run Backend Unit & Integration Tests (pytest)
        run: |
          PYTHONPATH=. pytest backend/tests/ -v

      - name: Terraform Format Check
        run: |
          terraform fmt -check infrastructure/

      - name: Terraform Init & Validate (No AWS Credentials Required)
        run: |
          cd infrastructure
          terraform init -backend=false
          terraform validate

  frontend-build-checks:
    name: Frontend Build & Asset Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Build Vite Production Bundle
        run: |
          cd frontend
          npm run build

